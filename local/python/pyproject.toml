[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-local"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary,pool]>=3.2,<4", "sqlglot>=27,<31", "plotly>=6,<7", "duckdb>=1.3,<2", "boto3[crt]>=1.43.111,<2", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-timeout>=2,<3", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
include = ["poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

